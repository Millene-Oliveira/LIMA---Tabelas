<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela 3</title>
    <link ref="stylesheet" href="./tabela3.css">
</head>

<body>
    <table>
        <thead>
            <tr class="centralizado">
                <th colspan="2">Informações do produto</th>
                <th colspan="2">Estoque</th>
            </tr>
            <tr>
                <th>Categoria</th>
                <th>Produto</th>
                <th>Preço</th>
                <th>Quantidade em estoque</th>
            </tr>
        </thead>

        <tr>
            <td rowspan="2">Periféricos</td>
            <td>mouse</td>
            <td>R$ 80,00</td>
            <td>10</td>

        </tr>

        <tr>
            <td>Teclado</td>
            <td>R$ 150,00</td>
            <td>3</td>
        </tr>

        <tr>
            <td rowspan="2">Armazenamento</td>
            <td>SSD</td>
            <td>R$ 220,00</td>
            <td>8</td>

        </tr>
        <tr>
            <td>Pen drive</td>
            <td>R$ 45,00</td>
            <td>4</td>
        </tr>

        <tr>
            <td rowspan="2">Monitores</td>
            <td>Monitor 24"</td>
            <td>R$ 900,00</td>
            <td>6</td>

        </tr>
        <tr>
            <td>Monitor 27"</td>
            <td>R$ 1.300,00</td>
            <td>2</td>
        </tr>

        <tr>
            <td colspan="3">Total de Unidades</td>
            <td>33</td>
        </tr>
    </table>

</body>

</html>
